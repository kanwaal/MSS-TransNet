[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mss-transnet"
version = "1.0.0"
description = "MSS-Trans-Net: multitask semi-supervised learning for breast ultrasound segmentation and classification"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Mehreen Kanwal"}, {name = "Yunsik Son"}]
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "numpy>=1.24", "Pillow>=9.4", "scipy>=1.10", "scikit-learn>=1.3", "ml-collections>=0.1.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/kanwaal/MSS-TransNet"

[tool.setuptools.packages.find]
include = ["mss_transnet*"]

[tool.setuptools.package-data]
"mss_transnet" = ["configs/*.json"]
"mss_transnet._vendor.transunet" = ["LICENSE"]
"mss_transnet._vendor.transunet2024" = ["LICENSE*", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
