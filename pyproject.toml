[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mss-transnet"
version = "1.1.0"
description = "MSS-Trans-Net: manuscript-aligned masked reconstruction and breast ultrasound multitask learning"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["torch>=2.4,<3", "numpy>=1.24", "Pillow>=9.4", "scipy>=1.10", "scikit-learn>=1.3", "ml-collections>=0.1.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mss_transnet*"]

[tool.setuptools.package-data]
"mss_transnet" = ["configs/*.json"]
"mss_transnet._vendor.transunet" = ["LICENSE"]
"mss_transnet._vendor.transunet2024" = ["LICENSE*", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
