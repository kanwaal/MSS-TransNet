[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proposed-breast-deep-heads"
version = "0.1.0"
description = "Breast ultrasound segmentation with deeper classification and area heads, 30% masked reconstruction"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["breast_benchmark*"]
